<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Mulish:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#FDF8EF;
       font-family:"Mulish",Arial,sans-serif;color:#3A2A12}
  .card{width:1200px;height:630px;display:flex;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;
    background:radial-gradient(46% 60% at 8% 12%,#F7E9CE,transparent 70%);}
  .left{position:relative;width:640px;padding:58px 40px 58px 62px;display:flex;flex-direction:column;justify-content:center}
  .brandrow{display:flex;align-items:center;gap:18px;margin-bottom:30px}
  .brandrow img{width:96px;height:96px}
  .bn{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:44px;line-height:1;
      letter-spacing:.05em;color:#8A5D0F;text-transform:uppercase}
  .bt{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7B6849;margin-top:8px}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;color:#A97514;margin-bottom:16px}
  .eyebrow i{display:block;width:34px;height:3px;background:#A97514;border-radius:3px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:54px;line-height:1.05;letter-spacing:-.015em}
  h1 em{font-style:italic;color:#A97514}
  .motto{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:27px;color:#A97514;margin-top:22px;letter-spacing:.01em}
  .phone{margin-top:30px;display:inline-flex;align-items:center;gap:13px;background:#A97514;color:#fff;
    padding:16px 28px;border-radius:999px;font-weight:800;font-size:25px;align-self:flex-start;
    box-shadow:0 16px 30px -14px rgba(169,117,20,.8)}
  .phone svg{width:26px;height:26px}
  .right{position:relative;width:560px;height:630px}
  .right img.photo{width:100%;height:100%;object-fit:cover;object-position:52% 50%}
  .right::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,#FDF8EF 0%,rgba(253,248,239,.55) 12%,transparent 34%)}
  .badge{position:absolute;top:44px;right:44px;z-index:3;background:linear-gradient(135deg,#C9932F,#8A5D0F);
    color:#fff;border-radius:22px;padding:16px 24px;text-align:center;box-shadow:0 18px 36px -16px rgba(58,42,18,.7)}
  .badge b{display:block;font-family:"Fraunces",Georgia,serif;font-size:44px;line-height:1}
  .badge span{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.95}
  .bar{position:absolute;left:0;right:0;bottom:0;height:12px;z-index:4;
    background:linear-gradient(90deg,#C9932F,#A97514 45%,#57401A)}
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="brandrow">
      <img src="assets/logo.svg" alt="">
      <div><div class="bn">Grace Wellness</div><div class="bt">Healthcare Centre for the Need</div></div>
    </div>
    <div class="eyebrow"><i></i>14 years experience · Bangalore</div>
    <h1>Expert nursing care, in the <em>comfort of home.</em></h1>
    <div class="motto">Care. Heal. Thrive.</div>
    <div class="phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>
      70903 44516
    </div>
  </div>
  <div class="right">
    <img class="photo" src="https://images.pexels.com/photos/18459193/pexels-photo-18459193.jpeg?auto=compress&cs=tinysrgb&w=1100" alt="">
  </div>
  <div class="badge"><b>14</b><span>Years of care</span></div>
  <div class="bar"></div>
</div>
</body>
</html>
